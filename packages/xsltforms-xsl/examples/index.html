<!DOCTYPE html><script src="xsltforms/xsltforms-xsl.js"></script>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:xf="http://www.w3.org/2002/xforms" xmlns:ev="http://www.w3.org/2001/xml-events" lang="en">
  <head>
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover"/>
    <title>XForms Samples</title>
    <xf:model>
      <xf:instance>
        <data xmlns="">
          <form label="Hello" name="hello.html"/>
          <form label="Calculator" name="calculator.html"/>
          <form label="Balance" name="balance-table.html"/>
          <form label="Colors" name="colors.html"/>
          <form label="Flags" name="flags.html"/>
          <form label="tinyMCE" name="tinymce.html"/>
          <form label="Wikipedia Search" name="wikipediasearch.html"/>
          <form label="Writers" name="writers.html"/>
        </data>
      </xf:instance>
    </xf:model>
  </head>
  <body>
    <xf:repeat ref="form">
      <xf:trigger ref=".">
        <xf:label ref="@label"/>
        <xf:load ev:event="DOMActivate">
          <xf:resource value="@name"/>
        </xf:load>
      </xf:trigger>
    </xf:repeat>
  </body>
</html>
